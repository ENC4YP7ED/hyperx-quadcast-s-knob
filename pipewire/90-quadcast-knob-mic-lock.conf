# Optional (install.sh --lock-mic-volume): only the knob (via pactl) and native
# PipeWire tools may change the mic level. Every other PulseAudio-protocol app
# (Discord, browsers, Zoom, games) has its source-volume changes ignored, so
# "automatic gain control" cannot drift the level behind the knob's back.
# pipewire-pulse quirk block-source-volume; "!" negates a match (pipewire.conf(5)).
pulse.rules = [
    {
        matches = [ { application.process.binary = "!pactl" } ]
        actions = { quirks = [ block-source-volume ] }
    }
]
